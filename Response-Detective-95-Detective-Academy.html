</style><header><span class="brand-icon" aria-hidden="true">🕵️</span><div><div class="brand-name">Response Detective 95</div><div class="brand-sub">Detective Academy · Guided Writing</div></div></header><main id="app"></main><script>const cases=[{"title": "Star Fruits", "topic": "Science", "level": "Rookie", "passage": "A star fruit is a sweet, yellow fruit. It grows in places with hot, wet weather. At first, this fruit only grew in places in Southeast Asia. But now, it is grown in other hot, wet places too. It is grown around the world! Star fruits are small. They have five big \"ribs\" on the outside. These look like big folds in the fruit's skin. When you cut this fruit the right way, you can make a special shape. The special shape has five big points. Can you guess what shape the star fruit makes?", "question": "Why is the star fruit named after a star?", "starter": "The star fruit is named after a star because", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "entering_2nd_grade_no_questions.pdf", "readerPdf": "passage-pdfs/case-01.pdf", "missions": ["Find a detail about the shape of the fruit.", "Find what happens when someone cuts the fruit."], "type": "evidence"}, {"title": "The Ants and the Grasshopper", "topic": "Fable", "level": "Rookie", "passage": "One bright day in late autumn a family of Ants was bustling about in the warm sunshine, drying out the grain they had stored up during the summer, when a starving Grasshopper, his fiddle under his arm, came up and humbly begged for a bite to eat. \"What!\" cried the Ants in surprise. \"Haven't you stored anything away for the winter? What in the world were you doing all last summer?\" \"I didn't have time to store up any food,\" whined the Grasshopper. \"I was so busy making music that before I knew it the summer was gone.\"\n\nThe Ants shrugged their shoulders in disgust. \"Making music, were you?\" they cried. \"Very well; now dance!\" And they turned their backs on the Grasshopper and went on with their work.\n\nThere's a time for work and a time for play.", "question": "What lesson does the grasshopper learn from the ants?", "starter": "The grasshopper learns that", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "ants.pdf", "readerPdf": "passage-pdfs/case-02.pdf", "missions": ["Find what the grasshopper did during summer.", "Find what happens when he asks the ants for food."], "type": "evidence"}, {"title": "A Frog's Life", "topic": "Science", "level": "Rookie", "passage": "From Egg to Frog\n\nWatch a frog grow.\n\nWhat would your life be like as a frog? You would have to know how to swim and hop. Frogs are amphibians (am-FI-bee-uhnz). Amphibians spend part of their lives in water and part on land. Most have smooth, wet skin. Most amphibians hatch from eggs.\n\nLearn about the\n\nlife cycle of a frog. A life cycle shows the stages in an animal's life.\n\n(1) Egg\n\nMost frogs come from tiny eggs.\n\nA mother frog lays eggs in or near water. A frog can lay thousands of eggs at once. The eggs are in large clumps. A jelly coating makes the eggs slippery. That protects them from being eaten by other animals.\n\n(2) Tadpole\n\nA tiny tadpole grows inside each egg. A few weeks later, the tadpole hatches.\n\nA tadpole lives in water. It breathes using gills. It uses its long tail to swim and moves like a fish. Tadpoles eat tiny water plants called algae (AL-jee).\n\n(3) Froglet\n\nDuring the next few weeks, the tadpole grows legs and toes. The tadpole's gills grow smaller, and the tadpole starts to grow lungs. It swims to the top of the water to breathe air. The tadpole starts to look more like a frog. It is called a froglet.\n\n(4) Frog\n\nThe froglet's tail gets smaller and soon disappears. Now the frog is an adult. It leaves the water and lives mostly on land. It breathes using lungs. It eats insects, worms, and snails. Mother frogs return to the water to lay eggs. Then the life cycle begins again.", "question": "How does a frog change as it grows from an egg into an adult?", "starter": "As a frog grows from an egg into an adult, it", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "c7ca6f5e-8fcf-430a-8e4b-497b995c4f9e.pdf", "readerPdf": "passage-pdfs/case-03.pdf", "missions": ["Find how a frog begins its life.", "Find how a tadpole changes.", "Find how the frog becomes an adult."], "type": "sequence"}, {"title": "Where Does Food Go?", "topic": "Science", "level": "Rookie", "passage": "What happens after you bite into a piece of food? First you chew the food, and then it travels through your body's digestive system. That system breaks down the food into small pieces so that it can be used as energy for your body. Open up, and follow the path of food.\n\nLook at the Digestive System\n\nFood travels to several places as it is digested, or broken down. Follow the trip food takes from the mouth to the intestines.\n\nBreaking Down Your Food\n\nWhen you take a bite out of an apple and start to chew, the apple mixes with the liquid in your mouth called saliva. Your saliva helps break down food.\n\nSending Food to Your Stomach When you swallow food, it travels down a tube called the esophagus. That tube leads to your stomach.\n\nTurning Food Into Liquid The stomach is made up of muscles that squeeze the food and mix it with special juices. That turns the food into liquid.\n\nCarrying Nutrients to Your Body The liquid moves to the intestines, where it is broken down again. The healthy parts of food that your body needs, called nutrients, are sent to other parts of your body. The unhealthy parts are pushed out of your body.\n\nYour Body Burns Calories A calorie is a unit of energy. Your digestive system works to break down food, and your body burns the calories from food. You burn calories at different rates depending on the activity you are doing. For example, you may burn more calories running than walking. How many calories you burn during an activity depends on many factors. It can also be different for every person!", "question": "How does the digestive system break down food and help the body?", "starter": "The digestive system breaks down food and helps the body by", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "food go.pdf", "readerPdf": "passage-pdfs/case-04.pdf", "missions": ["Find what happens in the mouth.", "Find where food travels next.", "Find what happens in the stomach.", "Find what happens in the intestines."], "type": "sequence"}, {"title": "Cesar Chavez", "topic": "History", "level": "Rookie", "passage": "During the 1930s, the United States was suffering from the Great Depression. This was a time when much of the country was poor. Most people could not find jobs, and food was short. People who worked on farms found they had to travel to find work. Many of them ended up in California. There, they worked on different farms and lived in camps. These people were called migrant workers.\n\nCesar Chavez was a Mexican American man from Arizona. When he was a boy, his family became migrant workers because of the Great Depression. They had to move to California to find work. He and his family worked in fields. The conditions were poor. Their housing had no electricity or running water. They did hard, tiring work for many hours. And they received little pay for their hard work. Chavez joined with Dolores Huerta. They decided to do something about the conditions migrant workers dealt with on farms. They created a union for farm workers called the National Farm Workers Association. This organization aimed to fight for the rights of farm workers. In 1965, the union joined a strike led by Filipino farm workers against grape growers in California. They were fighting for better pay and working conditions. Chavez and Huerta encouraged people to use peaceful methods to fight for the rights of the farm workers. They organized a big march to the capital of California. They got people to stop buying grapes from the grape growers. Chavez even went on a hunger strike, refusing to eat for 25 days. Finally, in 1970, the union succeeded. Twenty-six of the grape growers signed contracts with the union. They agreed to giving the workers better pay and working conditions.", "question": "How did Cesar Chavez and Dolores Huerta work to improve conditions for farmworkers?", "starter": "Cesar Chavez and Dolores Huerta worked to improve conditions by", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "chavez.pdf", "readerPdf": "passage-pdfs/case-05.pdf", "missions": ["Find how the leaders organized farmworkers.", "Find another action they took to improve working conditions."], "type": "evidence"}, {"title": "Walking Tall", "topic": "History", "level": "Junior", "passage": "How did Ruby Bridges make history? Many years ago, a little girl named Ruby Bridges arrived at her new elementary school. The school was in New Orleans, Louisiana.\n\nAs she walked toward the school’s front doors, an angry crowd of people stood outside. They shouted at her because they did not want Black children and white children to go to school together. Ruby was only 6 years old. United States marshals walked with her. A marshal is an officer. They were there to protect the first grader. Even though people were yelling, Ruby bravely walked into the school. The day was Nov. 14, 1960. On that morning, Ruby became one of the first African American students to attend an all-white elementary school in the South. Ruby Bridges started first grade in 1960. Bettmann/Corbis Before this happened, many schools were segregated by law. That meant Black children could not go to the same schools as white children. This was very unfair. U.S. leaders worked to end segregation. They helped bring civil rights to all Americans. Those are the rights to be treated equally. A few months before Ruby started school, a federal court ordered an end to school segregation in New Orleans. After that, schools slowly began to change.\n\nBy the time Ruby started the second grade, things got better. There were no more angry people outside her school. There were other Black students in her class. Today, children of all races go to school together.\n\nBridges says she was never scared to go to school during the first grade. “I wasn’t really afraid,” she told WR News. “I didn’t really know what was going on at the time, and I loved school.” Meet Ruby Bridges\n\nWR News student reporter Kaelin Ray asked Ruby Bridges how it feels to make a difference. Kaelin Ray: What was your first day at the school like? Ruby Bridges: My first day I spent sitting in the principal’s office, so it was very confusing. KR: How does it feel to know that you are a part of U.S. history? RB: I’m [very] proud of that fact. My mother was really happy about me being able to attend that school. My father was more concerned about my safety.", "question": "How did Ruby Bridges help change schools in the United States?", "starter": "Ruby Bridges helped change schools by", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "ruby.pdf", "readerPdf": "passage-pdfs/case-06.pdf", "missions": ["Find what Ruby did at her new school.", "Find how her actions helped change schools."], "type": "evidence"}, {"title": "Flying High: Becoming a Pilot", "topic": "Nonfiction", "level": "Junior", "passage": "Have you ever wondered how people learn to fly airplanes? Pilots fly planes and keep passengers safe. Becoming a pilot takes a lot of time and practice. First, a person may take a short flight in a small airplane with a professional pilot. They see what flying is like. If they enjoy it, they could go to flight school. At flight school, students learn important rules about flying. They study weather so they know when it's safe or dangerous to fly. They learn how airplanes work so they can operate a plane the right way. And they also practice flying with a flight instructor. The instructor teaches them how to take off, land, steer the plane, and handle emergencies. Students must spend many hours flying with an instructor before they can become a pilot. Students must also pass many tests. They need a doctor's checkup to show they are healthy enough to fly safely. They also take tests about the rules of flying and what to do in emergencies. After they pass these tests, they can earn a pilot license. This license allows them to fly without an instructor helping them. After getting their license, pilots keep training. They learn to fly in different types of weather and in bigger airplanes. After gaining enough experience, a pilot can become a commercial Mother and Daughter Fly Together\n\nTwo pilots who followed these steps ended up making history! On September 1, 2022, Captain Kamelia Zarka and her daughter, Maria Zarka, flew together as the first mother- daughter pilot team for Hawaiian Airlines. Kamelia Zarka was born in Tonga, an island country in the Pacific Ocean. She first worked as a flight attendant for Hawaiian Airlines. Flight attendants make sure passengers are safe and comfortable during a flight. One day, a pilot invited her to sit in the cockpit, the area in the front of the airplane where pilots sit and control the plane. That flight changed Kamelia Zarka's life. She thought... I could do this job! Soon after, Zarka signed up for flight school. She followed all the steps to become a pilot. In 1999, she became the first female Tongan captain of a large commercial airline. This was a huge achievement!\n\nKamelia Zarka often brought her daughter Maria on flights. Watching her mother fly inspired Maria to become a pilot too. Years later, Maria Zarka got her own pilot license. She soon began working for Hawaiian Airlines. Today, women make up only about 7-8% of airline pilots, but pilots like the Zarkas are helping change that. Before their historic flight on August 31, 2022, they took pictures with passengers and crew members. They also encouraged young girls to follow their dreams. They want to inspire more women to become pilots.\n\nIt was a very special day as the Zarkas flew together over the Hawaiian islands, the place they now call home.", "question": "How did Kamelia Zarka inspire her daughter Maria to become a pilot?", "starter": "Kamelia Zarka inspired her daughter Maria by", "author": "Caitlyn Meagher", "credit": "© 2026 ReadWorks, Inc. All rights reserved.", "sourceFile": "Flying High.pdf", "readerPdf": "passage-pdfs/case-07.pdf", "missions": ["Find what Maria learned about her mother.", "Find how her mother influenced Maria’s choices."], "type": "evidence"}, {"title": "Ancestral Pueblo", "topic": "History", "level": "Junior", "passage": "The Pueblo are a group of Native American people. There are many different Pueblo communities. Many Pueblo people live in an area called the Four Corners. This is where the present-day states of Arizona, New Mexico, Utah, and Colorado meet. The Pueblo call their ancestors the Ancestral Pueblo.\n\nThe existence of the Ancestral Pueblo in the American Southwest goes back at least two thousand years. At first, they hunted game and gathered seeds, berries, and plants. They did not stay in one place for very long. Eventually, they began to plant crops.\n\nThe first Native people of the Americas who raised corn lived in Mexico about seven thousand years ago. Over time, various groups of people in the Americas, including the Ancestral Pueblo, also added corn to the crops they raised.\n\nBecause the Ancestral Pueblo raised crops for part of the year, they set up permanent farming villages. They built their villages on large, flat-top hills called mesas and in cliffs. And they planted their crops near the streams in the valleys below cliffs. As well as corn, they grew beans and squash. They also continued to hunt and gather wild plants. Women and girls had the job of raising crops and gathering wild plants. Men mostly hunted and traded.\n\nThe Ancestral Pueblo were skilled basket weavers and potters. Ancestral Pueblo Villages As the population grew, the Ancestral Pueblo spread over a wide area in the Southwest. They built villages in several different styles. At first, they built pit houses which were sunk a few feet into the ground. Then, they made some dwellings above ground with stone and adobe (/uh*doe*bee/), which was made of clay. Each of these dwellings had places for sleeping and storing food. Eventually, they built dwellings into the sides of cliffs. Along with sleeping and food storage areas, these buildings had places for meetings, religious ceremonies, and celebrations. Outdoor plazas or porches connected the living areas. One style of building was two or three stories high. The flat roof of one story formed the porch for the story above. Ladders connected each level. Some of these cliff dwellings had over 100 rooms!\n\nThe Ancestral Pueblo also built paths and trails to connect the settlements where they lived. With other groups, they traded pottery, woven goods, jewelry, and tools.\n\nWhat Happened to the Ancestral Pueblo? For hundreds of years, the Ancestral Pueblo lived in an area of the Four Corners. Over time, many communities left these areas. What happened? We don’t know. Scientists have several different ideas. Farming can be very hard. Crops need light, warmth, and water to grow. They also need minerals in the soil to be healthy. Over many years, the Ancestral Pueblo may have worn out the soil. The weather also may have changed. Without enough rainfall, it is difficult to grow food to eat. The animals used for food struggle to survive, too. These changes may have made the Ancestral Pueblo leave their cliff dwellings and move.\n\nNo one knows for sure why the Ancestral Pueblo left. Today, the Pueblo people who live in small groups throughout the Southwest trace their roots to the Ancestral Pueblo, the cliff dwellers of long ago.", "question": "How did the Ancestral Pueblo use their environment to build communities and grow food?", "starter": "The Ancestral Pueblo used their environment by", "author": "ReadWorks / Core Knowledge Foundation", "credit": "Adapted from Core Knowledge Foundation, CC BY-NC-SA 4.0", "sourceFile": "ancestral pueblo.pdf", "readerPdf": "passage-pdfs/case-08.pdf", "missions": ["Find how the people used their surroundings to build homes.", "Find how they used their surroundings to grow food."], "type": "evidence"}, {"title": "Cherokee Storytelling and Written Language", "topic": "History", "level": "Junior", "passage": "The Cherokee (/chair*uh*key/) are a southeastern Native American Nation. Their homeland was what are now the American states of western North Carolina, eastern Tennessee, and northern Georgia. Some Cherokee still live there. However, the U.S. government forced most of the Cherokee to move from their homeland to what is now Oklahoma.\n\nBefore coming into contact with European settlers in the 1700s, the Cherokee lived in small communities on good farming land. They built wood-frame houses with walls made of woven vines or branches plastered with mud. Each village had a central building, or council house, for celebrations, ceremonies, and meetings. Each group of Cherokee had two chiefs. One chief ruled during peacetime. The other chief ruled during war. The chiefs helped to guide the people and make decisions. But the chiefs did not have complete control over the people. The people had a say in how they were ruled.\n\nImportant parts of the Cherokee culture were captured in stories, or legends. These stories were part of a Cherokee tradition of oral storytelling. Their important legends were passed down through the generations. These legends explained how their world had come into being and how people should live. Cherokee language writing In the late 1700s and early 1800s, the Cherokee became the only Native American people in the United States at the time who kept written records.\n\nThe written language of the Cherokee was created by a man named Sequoyah (/si*kwoi*uh/). He was born in the 1770s in what is now Tennessee. Sequoyah became interested in books and letters, which he had seen written in English.\n\nHe wanted the Cherokee to have a way to preserve their language and stories, too. He invented a set of symbols for the Cherokee language. This allowed the Cherokee language to be written and read. A Cherokee newspaper, the Cherokee Phoenix, was first published in 1828. The newspaper was published in both English and Cherokee. This newspaper is still published today! Over its many years, the Cherokee Phoenix has been used to unite the Cherokee around important causes. For example, on many occasions, the newspaper informed Cherokee about U.S. policies that impacted the Cherokee Nation. It's an important way for the Cherokee Nation to stay connected and informed. Oral storytelling and written language are both important ways for the Cherokee to celebrate their history!", "question": "How did storytelling and written language help the Cherokee preserve their culture?", "starter": "Storytelling and written language helped the Cherokee preserve their culture by", "author": "ReadWorks / Core Knowledge Foundation", "credit": "Adapted from Core Knowledge Foundation, CC BY-NC-SA 4.0", "sourceFile": "Cherokee.pdf", "readerPdf": "passage-pdfs/case-09.pdf", "missions": ["Find how stories passed on knowledge.", "Find how written language helped preserve knowledge."], "type": "evidence"}, {"title": "Attack of the Leftovers", "topic": "Fiction", "level": "Junior", "passage": "\"We have too many mashed potatoes,\" said Caroline. \"I know!\" said her brother, Stewart. \"I am sick of them.\" \"We've had mashed potatoes for lunch.\" \"We've had mashed potatoes for dinner.\" \"We've even,\" said Caroline with a grimace, \"had them for breakfast.\" \"Thanksgiving is over,\" said her brother, crossing his arms. \"We want new food.\" Thanksgiving had happened five days earlier. Everyone came over to their house: aunts and uncles and cousins. Even a long-lost aunt from Alabama. They ate turkey and mashed potatoes and stuffing and gravy. Lots and lots of gravy. It was great. It made everyone sleepy. But when everyone left, the food was still there. Turkey. Mashed potatoes. Stuffing. Gravy. Everywhere! The counters were covered. Food invaded the fridge. It sat on Caroline and Stewart's plates for days and days. Eventually, it got boring. \"Pleeeeeeeeeeease,\" said Stewart. \"Make us something else!\" \"Not mashed potatoes.\" \"Anything but that!\" \"Hmm,\" said Mom. She was quiet for what seemed like a long time. Her finger tapped against her mouth. \"I think I have an idea.\" She took out a container. Stewart's mouth fell open. \"Mom!\" he shouted. \"Are you crazy? Those are the mashed potatoes.\" \"They sure are,\" said Mom. \"I think I just remembered something my grandmother used to do.\"\n\nMom pulled out a frying pan and a jug of vegetable oil. She poured the oil in the pan. It went glug, glug, glug. She turned on the heat. Stewart and Caroline backed away. They are not allowed near the stove when hot oil is in the pan. While the oil got hot, Mom fixed the potatoes. She turned the container upside down. \"Plop!\" went the potatoes. They fell onto the counter in a cold, hard block. With her sharpest knife, Mom sliced the potatoes into squares. She dusted them with flour. She sprinkled them with salt. She covered them with pepper.\n\nAnd then she slid them into the oil. Sizzle! went the oil. Sizzle, sizzle, sizzle! \"Whoa, Mom,\" said Caroline. \"What are you doing?\" \"I'm frying the potatoes. The same way you would make French fries. It's a good way to get rid of leftovers.\" When the potatoes stopped sizzling, they were done. Mom lifted them from the oil and let them dry. Once they were cool, Caroline picked one up in her hands. \"Don't you want one, Stewart?\" \"No!\" he said. \"I told you. No more mashed potatoes.\" Caroline lifted the block of crisp, brown potato to her mouth. She took a tiny bite-the tiniest bite in the world. \"Oh boy,\" she said. \"Oh boy, Stewart. These are good.\" He took a bite, too. She was right. The potatoes didn't taste like mashed potatoes at all. They were crisp and brown on the outside. They were creamy and fluffy on the inside. It was like eating a crispy cloud. \"See?\" said Mom. \"Leftovers aren't the end of the world.\"", "question": "How do Caroline and Stewart change their minds about eating leftover potatoes?", "starter": "Caroline and Stewart change their minds about leftovers when", "author": "ReadWorks", "credit": "© 2013 ReadWorks, Inc. All rights reserved.", "sourceFile": "Attack of the Leftovers.pdf", "readerPdf": "passage-pdfs/case-10.pdf", "missions": ["Find how the children feel about leftovers at first.", "Find what changes their minds.", "Find how they feel at the end."], "type": "change"}, {"title": "Amy's Halloween Secret", "topic": "Fiction", "level": "Master", "passage": "It was almost October 31, and Amy was excited. Halloween was her favorite day of the year. She found it more fun than Christmas, because she got so many more presents, in the form of candy. And she also found it more fun than her birthday, because on Halloween, everyone dressed up and had a party, not just Amy!\n\nAmy was also excited because she had just moved to Brooklyn, in New York City. Her mother had been hired as an English professor at a nearby university, so Amy, her mom, and her dad had packed up their things in St. Louis, Missouri, and moved their lives to the East Coast. Amy had heard a lot of things about New York City and wondered what Halloween in Brooklyn was like. Did the kids dress up and go trick or treating, like they did in St. Louis? Did parents hand out candy, or did they only have healthy treats? What kind of costumes did people wear? Amy was impatient to find out; thank goodness it was already October 29! On the 31st, Amy rushed home from school, and found her costume laid out on her bed, all ready to wear. Her mom had stayed up late the night before working on it. Now it was ready, and it looked perfect! Amy loved the Winnie the Pooh stories, and this year, she was going to be Tigger, the bouncy, happy tiger. Her mom had found the perfect orange and black fabric for her costume, which also matched with the orange and black colors of Halloween.\n\nAfter Amy's mom had painted whiskers on Amy's face, the two of them set off to explore the neighborhood. Amy's mom had cleverly sewn a pouch into the Tigger costume, where Amy could store her candy. They went around her block and then ended up near a park, where a\n\nlot of kids were playing in their Halloween costumes. A small house stood at the center of the park. Amy wanted to go closer and investigate. A plaque next to the house said this was the \"Old Stone House,\" built in 1699. \"That's more than three hundred years ago!\" Amy said to her mother. \"Does anyone live there now?\" \"It's Halloween,\" her mother said. \"I think we should knock on the door and find out!\" Amy was a little nervous, so she held onto her mother's hand as they walked up to the door. They knocked. No response. Amy tried again, this time more loudly. She thought she heard voices inside. Children's voices?\n\nAmy tried pushing the door open and was startled when it moved! Why wasn't the house locked? Who was inside it? Still clutching her mother's hand, Amy began exploring. \"Hello?\" she called out. \"Anybody home?\" Silence. \"Trick or treat?\" she tried.\n\nAmy and her mother walked all around the house, upstairs and downstairs. It was dark, and there were no light switches. It was hard to make out much detail, but Amy could imagine that a family had lived there three hundred years before. There was clearly no candy to be had, so they decided to leave. Right as Amy was shutting the door, she swore she saw a little girl, very pale, run past her in the living room. \"Come back soon!\" the girl whispered to Amy, which gave Amy the chills. \"What's wrong?\" her mother asked her. \"Oh, nothing,\" Amy said. She decided that the ghost girl in the Old Stone House would be her Halloween secret.", "question": "How do Amy's feelings change as she explores the Old Stone House?", "starter": "As Amy explores the Old Stone House, her feelings change from", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "halloween.pdf", "readerPdf": "passage-pdfs/case-11.pdf", "missions": ["Find how Amy feels at first.", "Find what happens inside the house.", "Find how her feelings change."], "type": "change"}, {"title": "Fixing My Sister's Bike", "topic": "STEM Fiction", "level": "Master", "passage": "I love to fix things. I'm only eight years old, but I can figure lots of stuff out by myself. I want to be a scientist when I grow up. Last week, the red, shiny reflector came off my sister's bicycle seat. My sister Ariel said she wanted to take it to the bicycle repair shop to be fixed. \"No way!\" I stopped her. \"I know how to fix things, so I'll fix this too!\" \"Well, it had better work!\" Ariel said. She looked like she didn't believe me. I got some rope from the closet, and I tied the reflector right back onto the bike. It dangled a little bit, but it still worked just fine. \"It looks messy,\" Ariel said. When my dad came home, I showed him how I had fixed the bike. \"Do you think that's the best solution?\" he asked me. I looked over at the reflector. On second glance, it didn't look that secure after all. There were some pieces of rope hanging off. I shrugged. \"Yes! It's fine!\" I said. I thought it was the best solution. I had come up with it, after all, so it had to be the best. \"Okay,\" he said. \"Let's see how long it stays attached to the bike.\"\n\nMy dad said he was proud of me for taking initiative. That means I see something that needs to be fixed and do it without being told! \"I think I have a new lesson for you, though,\" Dad said. \"I want to show you how to conduct an experiment.\"\n\nI had come up with a solution to a problem, and now the second step was to test it under different conditions.\n\nI asked my sister when she was planning to go for a bike ride. She said at 2:00 p.m.\n\nI grabbed a pen and a piece of paper and made two columns on the paper. One column said GOOD, and one column said BAD. At 2:00, I went outside to watch her ride. First, she rode down the sidewalk and the reflector stayed on. I made a checkmark in the GOOD column. Next, she went over a bump and the reflector stayed on. I made another checkmark. Good again! Then, she rode underneath a tree. Uh oh! I knew what was coming next.\n\nOne of the branches from the tree swept across the back of her bike, and the next thing I knew the whole reflector was untied and on the ground! Ariel cried out, \"My reflector!\" I made another checkmark, this time in the column that said BAD. \"Back to the drawing board!\" I said. \"Grrr!\" said Ariel. Later that night, my dad and I sat down with my paper to look at the checkmarks. \"Under what conditions did the reflector stay on the bike?\" he asked me. I looked. \"Well, it stayed on when the bike was riding normally, but it fell off when it was hit by that tree branch.\" \"What you have on that sheet of paper is called scientific data,\" Dad said. \"What do you think you can learn from this?\" \"I don't think the rope worked very well,\" I said. \"I don't think so, either,\" he said. \"But you did have to test it first to be sure.\" \"Well, I tested it and now I know.\" \"What will hold the reflector on a little bit better?\" \"Let's use glue!\" I said. We went downstairs, where the family keeps all our tools. Dad pulled the bike up onto the bench and took out the Super Glue.\n\nI'm not allowed to use strong glue by myself. So we did this part together. We let the glue dry overnight, and the next day I conducted my experiment all over again. \"You're not going to break my reflector again, are you?\" my sister asked. She looked a little mad and suspicious. \"Well, I don't think so,\" I told her. \"But that's what this experiment is for. Do you trust me?\" \"I guess so,\" Ariel said. \"But mainly because Dad helped this time!\" She stuck her tongue out at me.\n\nI made her ride the bike exactly the same way she had the last time so that we could try to recreate the conditions. This is important in a scientific experiment. She rode down the sidewalk. The reflector stayed on. So far, so good! Then, I had her go over the bump again. The reflector stayed on. I made another checkmark. But now it was time for the final test. \"Okay, get ready!\" I yelled. \"It's time to ride under the tree!\" Just like last time, my sister rode under the tree. However, this time, the reflector stayed on the bike. \"Yay! It didn't fall off!\" Ariel squealed happily. I was pretty proud myself. I made a great big checkmark in the GOOD column, and then drew a smiley face just for fun.\n\nI turned around to see that my dad had been watching the entire time. \"Excellent work, little scientist,\" he said. \"You recreated the experiment and found the solution to your sister's bike problem.\" \"And I saved us a trip to the bike shop!\" I said. \"You sure did,\" Ariel said. And then she gave me a great big hug.", "question": "How does the narrator use an experiment to solve the bicycle problem?", "starter": "The narrator uses an experiment to solve the problem by", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "bike.pdf", "readerPdf": "passage-pdfs/case-12.pdf", "missions": ["Find the bicycle problem.", "Find what the narrator tests.", "Find what the test reveals.", "Find how the problem is solved."], "type": "sequence"}, {"title": "Reigner's Words", "topic": "Fiction", "level": "Master", "passage": "Reigner loved to eat alimasag. It was one of his favorite things about living in Baltimore. His parents raised him on a diet full of rice and adobo, but also enjoyed local favorites like these pink shellfish with big claws. They always ate it with Baltimore's favorite Old Bay seasoning. Some days before he left for school, Reigner would ask, \"Can we eat alimasag tonight?\" His parents smiled and often said yes. They wanted him to be as much a Baltimorean as he was Filipino. So Reigner was ready when his teacher, Mr. Hawkins, asked students to name their favorite animal. \"Tell me what it is,\" Mr. Hawkins said, \"and in the next few days you will make a presentation about it.\"\n\nReigner knew exactly which animal he would choose. As students picked, Mr. Hawkins wrote their choices on the board: cow, octopus, giraffe, lion. No one had chosen Reigner's animal yet! \"Reigner? What animal do you choose?\" Mr. Hawkins asked. \"The alimasag!\" \"I'm sorry, what?\"\n\nA few of Reigner's classmates giggled. \"The... alimasag.\" Reigner made pinching motions with two fingers. \"Like this?\" A boy sitting behind Reigner laughed loudly. \"What is that?\" he asked, pinching his fingers like Reigner. Now the rest of the class laughed. Reigner, embarrassed, sank into his chair. Mr. Hawkins blinked a few times. \"Oh...a crab?\" Reigner quietly nodded. Mr. Hawkins wrote 'crab' on the board. \"Shh, settle down, everyone. That was just another way to say 'crab.' Right, Reigner?\" \"I guess so,\" he answered, quietly.\n\nThe rest of the class went on to name their favorite animals, but Reigner felt too embarrassed to pay attention. He waited for recess and instantly ran outside. He wanted to be alone. Reigner thought about what had happened.\n\nHis parents sometimes spoke to him in the Filipino language of Tagalog. That meant they might use different words than other people did. For example, Mr. Hawkins said \"dog\" while his mom said \"aso.\" He said \"bathroom\" but his dad said \"banyo.\" And, Reigner realized, when his parents said \"alimasag,\" other people said \"crab.\"\n\nNow Reigner climbed to the top of the jungle gym. He watched his classmates. Two of them pinched their fingers together and their friends laughed. Reigner wanted to hide. Suddenly, a dog sprinted onto the playground. The dog was acting wild, barking loudly, even tripping a boy as it ran between his legs. \"Stop! Stop!\" kids shouted. Mr. Hawkins tried to chase the dog but it was too fast. The pooch wasn't listening to anyone. Reigner climbed down to the ground. The dog started running toward him. He held up a hand and called out, \"Tigil!\" Startling everyone, the dog stopped. Even Reigner looked surprised. Then he pointed down and said, \"Umupo.\" The dog sat! \"Good aso,\" Reigner said, scratching the dog behind its ears. The dog calmed down. \"Wow!\" said a girl nearby. \"How did you do that?\"\n\nA moment later a woman ran onto the playground, an empty leash in her hands. Out of breath, she hurried over to Reigner. \"I'm so sorry, this is my dog,\" she said. Then she clipped the leash back onto his collar. \"Praning, you can't do that...\" \"I told him to tigil and he did,\" Reigner told her. \"Well, that's because I trained him in Tagalog!\" the woman replied. \"Thank you for helping Praning. I don't know what I would have done if you weren't here.\" After the lady apologized to Mr. Hawkins and left with her dog, some of Reigner's classmates ran over to him. \"How did you do that? !\" \"Can you teach me?\" \"That was awesome!\" Reigner was embarrassed, but in a good way now. A couple of kids began pinching their fingers. \"Tell us about the alimasag!\" they shouted. Soon, everyone was pinching fingers together like Reigner. He pinched his together too, happily laughing with his classmates.", "question": "How do Reigner's feelings about speaking Tagalog change during the story?", "starter": "At first, Reigner feels one way about speaking Tagalog, but later he", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "reigners.pdf", "readerPdf": "passage-pdfs/case-13.pdf", "missions": ["Find how Reigner feels about Tagalog at first.", "Find what changes his feelings.", "Find how he feels later."], "type": "change"}, {"title": "Jamilla's Backyard Discovery", "topic": "Fiction", "level": "Master", "passage": "\"What's that?\" wondered Jamilla Redstone. She was sitting under her favorite tree in her family backyard, reading a storybook, when she noticed something sticking out of the ground near the roots.\n\nJamilla often dug for treasure in her backyard. She would press her small shovel into the soft mud and see if it hit anything. Sometimes, she felt the edges of hard, mysterious things. She pulled them out of the dirt, wiped them off, and saw their shapes. Over the last year, she had discovered pennies, an old dog chain, and some beautiful rocks.\n\nNow she put down the book and took a closer look at the bump in the ground. She picked up a stick and began scratching around. She was surprised when her scratching uncovered a small, hard piece of clay. It was painted blue. Hmm, she thought. Maybe last night's rain washed away the dirt that covered this piece of clay. Are there other pieces buried around here?\n\nJamilla went into her house to get her shovel. She came back and started digging. Soon, she found five more pieces of clay, all of them painted. She took the pieces to the sink and washed them clean. Etched into four of the six pieces was a pattern of lines with letters next to each line. Did they have a secret message? Jamilla brought the pieces to her grandfather, who was sitting outside on a step. \"Papa, look at what I found! What do you think these lines and letters mean?\" she asked. \"Well, would you look at that!\" her grandfather said. \"That's quite a special treasure you found. Let me show you something special of my own.\" He brought Jamilla back inside the house, went into the parlor, and brought out his family Bible. \"I've had this book for a long time-since before your mom was born! And all that time, I have been tracing our family history in the front pages,\" her grandfather explained. \"Look,\" said Jamilla, pointing to the names. \"Each one says Redstone.\" Jamilla pointed to her name at the bottom. \"And there is me!\" \"Yes!\" said her grandfather. \"Now draw a line with your finger from one person to another.\"\n\nJamilla traced an invisible line in the Bible from the first Redstone name to herself. \"Give me those pieces of clay,\" her grandpa said. \"Don't they look a little like a jigsaw puzzle? Let's see if we can put them together.\"\n\nJamilla and her grandpa worked for a while. They found four pieces that seemed to fit together. \"What do you see about the lines?\" her grandfather asked. Staring at the pieces, Jamilla noticed that some letters ended up under each other. \"They don't spell anything,\" she told her grandpa. \"That's true. But look at how the letters go in order. Then look at the names in the Bible.\" \"A, R, L, J: those four letters on the clay are in the same order as the letters in the book!\" she called out, excited. \"You're right, dear Jamilla. And here's why:\n\nI made that pot out of wet clay on the day you were born,\" Papa said proudly. \"And then I etched the first initials of our family members into it before the clay became dry. Later, I planted seeds in that pot. The seeds grew into a tree-\" \"Our weeping willow!\" Jamilla exclaimed. \"Yes, our weeping willow. But as the tree grew, that pot broke,\" Papa noted. \"And I just found some of the pieces!\" \"You did!\" said her grandfather. \"You found the roots of your family at the roots of the willow tree.\" Jamilla thought about what her grandfather said. He had planted a tree for their family. Then their family had grown bigger with every generation, just like that tree grew tall.\n\nThe broken pot she found was more than a backyard treasure: It was preserving her family's history!", "question": "Why is the broken clay pot more important to Jamilla than the other treasures she has found?", "starter": "The broken clay pot is more important to Jamilla because", "author": "Fatima Shaik", "credit": "© 2023 ReadWorks, Inc. All rights reserved.", "sourceFile": "Jamilla's Backyard Discovery.pdf", "readerPdf": "passage-pdfs/case-14.pdf", "missions": ["Find what Jamilla learns about the pot.", "Find why that discovery matters to her."], "type": "evidence"}, {"title": "Chicken Soup for Nicole", "topic": "Fiction", "level": "Master", "passage": "\"Hello?\" said Elizabeth. \"Are you there?\" \"Ahhhhhhh-choo!\" \"Nicole?\" \"Ahh-choo!\" \"Gesundheit.\" \"Ahh-choo!\" \"If you don't stop sneezing, how are we ever going to have a conversation?\" \"I'm sorry,\" said Nicole, finally. Her voice sounded thick and tired. \"I think I have a little cold.\" \"Oh no, you don't. Uh-uh. Not today. Today we are going to the beach.\" \"I don't know. I feel pretty awful. My nose is runny and my eyes are itchy, and my head feels like someone stuffed it full of boiled cabbage.\" \"Beeswax!\" said Elizabeth, which is what she always told her best friend when she was talking nonsense. \"Absolute beeswax. Who ever heard of someone getting a cold in July?\" \"I guess I'm some kind of medical miracle.\"\n\nElizabeth chewed her fingernail and looked down at her bathing suit. It was an adorable one -the most adorable she had ever owned-with pale pink stripes that nicely accented her blue eyes. She had bought it in April, and had spent the last months of school looking forward to the first day she could wear it at the beach. Today was meant to be the day. Each summer, Elizabeth's brother and his friends spent every day, from lunchtime to sunset, lounging on the sand. By the end of June they were as red as lobsters, and by halfway through July they were as tan as beech nuts. (Elizabeth wasn't sure what a beech nut was, but she knew it must be very brown.) Every summer, she and Nicole begged him to take them along, but he always refused. \"You guys are too young,\" David would say. \"Maybe next year.\" Finally, next year was here. Two days before, their mother had said to David over dinner, \"Why don't you take Elizabeth to the beach with you on Friday?\" \"I can't, Mom. She's just a kid.\" \"Oh, come on. She's too old to spend another summer sitting around the house. Take her with you! It will be fun.\" And because in their family, you simply didn't argue with Mom, that was it. Elizabeth and Nicole had their ticket to the beach. \"Until you had to get sick and spoil it!\" exclaimed Elizabeth. \"I'm sorry,\" sniffled Nicole. \"Why don't you just go without me?\" \"Did your cold rot your brain? You really think I would go to the beach alone with David and his friends? It would be more boring than school. You're coming, and that's it.\" \"I can't. I have a fever.\" And that was that. In Nicole's family, you simply didn't argue with a fever. \"Beeswax,\" said Elizabeth. \"Positively beeswax.\"\n\nDavid was loading the cooler into his car when his sister stomped out of the house. \"Hurry up,\" he said. \"It's a beautiful day, and I don't want to miss a minute. I'm getting paler by the second-do you see?\" Elizabeth scowled at him. \"Where's your suit?\" \"I'm not coming to the beach today.\" \"Okay. Your loss.\" He started the car. \"Could you get out of the way? I have to back out, and Mom would be mad at me if I squished you.\" \"Mom said you need to take me to the grocery store. It's for Nicole.\"\n\nDavid looked at his sister in the rearview mirror. She was trying to smile at him, but it wasn't working. She was trying to look sweet. Something was definitely up. \"You're lying,\" he said. He revved his engine, startling her, and she jumped out of the driveway. \"Mom didn't tell you a thing, which means that I don't have to take you anywhere, which means that I'm going to the beach. So long!\" He drove away, and Elizabeth wondered if there was anywhere on the Internet that explained how to melt older brothers with your mind. She had been lying, and he knew. He always knew. She would have to ride her bike. David was right. It was a beautiful day-just hot enough to go to the beach, but far too hot to be riding a bike. Elizabeth felt like her skin was going to sweat off, and only made it to the store by imagining how good the air conditioning would feel inside. She parked her bike, locked it, and inhaled sharply when the icy air hit her chest. \"Spectacular,\" she murmured. If only Nicole had been there to appreciate it. At the butcher's counter, she rang the bell for service, and the butcher appeared: a pimply- faced young man who was really too old to have pimples. \"May I help you?\" he asked. \"I need to buy a chicken.\" \"What cut do you want? Thighs, drumsticks, breasts?\" \"I don't know. Just give me the whole thing.\" \"Broiling Chickens are over there. See?\" She had seen. In the poultry aisle, there were all sorts of pale bits of chicken, sealed tightly under plastic, shimmering in the harsh white light. To one side were whole chickens, plucked bare and sad-looking. It made her skin lurch to look at them. She picked up the least disgusting one, and grimaced when it squelched through the plastic. \"Think of Nicole,\" Elizabeth said. \"Just think of poor, sick, sniffly, selfish, beach day-ruining Nicole!\" Failing to contain her anger, she marched up and down the store, grabbing all sorts of things she thought she might need: avocados, noodles, some pineapple, teriyaki sauce and mayonnaise. (Mayo was Nicole's favorite.) The clerk at the checkout line gave her a funny look. \"What are you making, little girl?\" he asked. \"Jeez,\" she said. \"Duh. Jeez. Obviously, I'm making chicken soup.\" Step one: get the biggest pot you can find. Elizabeth nearly toppled off the counter as she lifted her mother's largest stock pot, which slipped through her fingers and crashed to the floor. The pot was unharmed, but the floor was pretty badly nicked. It didn't matter-there was no time to waste. Elizabeth filled the pot with water, but it was too heavy to pick up and out of the sink. She dumped it out, sloshing only a little onto the floor, and put it on the stove. She poured cup after cup of water into it, managing to fill it after twenty minutes or so, when she turned the heat on high. Now, the chicken. She unwrapped the bird carefully, and lowered it into the pot with her mother's tongs. \"No way am I touching that,\" she said. The chicken plopped into the water, sending a wave over the side of the pot, where it hissed away on the flame. Along with the chicken, Elizabeth added all the soup stuff she could think of: carrots, onion, celery, potatoes, radishes, Brussels sprouts, broccoli and a banana. She wasn't allowed to use the knife, so she couldn't chop any of the vegetables, but she did the best she could with what she had: prying the broccoli apart with her teeth, and mashing the potatoes and banana with her elbow. Now she just had to wait. \"This is going to be awesome,\" she said. \"This will be the best chicken soup Nicole has ever tasted, and she's going to be so thankful that she'll feel just awful that she spoiled our day. That will show her!\" The water was not boiling. She stuck her finger in it. It was barely even warm. While she waited, she added a few handfuls of pineapple, noodles, teriyaki sauce and mayonnaise. (The avocado she ate while she waited, because avocado makes an excellent snack.) After what seemed like nine or ten hours, but was actually just eight minutes, she checked the water again. It still wasn't bubbling. \"Beeswax,\" she said, and sipped her broth. It tasted like watered down mayonnaise with teriyaki sauce in it. It tasted terrible. \"Double, triple, quadruple, infinity beeswax!\"\n\nElizabeth's mother was gardening when she heard her daughter shouting. \"Hmm,\" she said, and popped her head in the kitchen door. \"It looks like a tornado came in here.\" \"Mom-I think your oven is broken. This soup tastes terrible.\" \"That's soup?\" \"Obviously. I'm making chicken soup for Nicole because she's a jerk.\" \"I see,\" said Mom, who didn't see at all. \"Why all the teriyaki sauce and pineapple?\" \"It's Hawaiian-inspired.\" \"Let me see if I can help.\" *** Nicole was blowing her nose when the doorbell rang. \"One second!\" she shouted. When she opened it, Elizabeth thrust a Thermos in her face. \"Here,\" said Elizabeth. \"I made you some soup. I made it out of spite.\" \"Out of what?\" \"It means that I'm mad that you got sick, and so I made you soup. Well, really my mom made it. And actually, it's out of a can. But I opened the can!\" Nicole gave Elizabeth a big hug. \"Thank you! That was so sweet. My throat is sore, and I'm just dying for some soup.\" As her friend hugged her, Elizabeth realized that she wasn't mad at Nicole. She was just hungry. They were just pouring the soup into bowls when they heard the thunderclap. Sheets of rain whipped against the window, and they watched from the kitchen, safe and dry.", "question": "How do Elizabeth's actions show that she cares about Nicole?", "starter": "Elizabeth shows that she cares about Nicole when", "author": "ReadWorks / credited author in source", "credit": "ReadWorks passage; see source PDF for copyright and attribution.", "sourceFile": "chicken soup.pdf", "readerPdf": "passage-pdfs/case-15.pdf", "missions": ["Find one thing Elizabeth does for Nicole.", "Find another action that shows Elizabeth cares."], "type": "evidence"}];

let test=false,idx=-1,s,phase=0;const fresh=()=>({step:0,answer:'',parts:[],final:'',done:false});let db={};try{db=JSON.parse(localStorage.getItem('rd95-guided-all-v1')||'{}')}catch{};const slot=()=> (test?'test:':'student:')+idx;function save(){if(idx<0)return;db[slot()]=s;try{localStorage.setItem('rd95-guided-all-v1',JSON.stringify(db))}catch{if($('status'))$('status').textContent='Browser saving unavailable.'}}function openCase(i){idx=i;s=db[slot()]||fresh();phase=s.step;render();topPage()}function topPage(){window.scrollTo(0,0);$('heading')?.focus({preventScroll:true})}function go(n){s.step=n;phase=n;save();render();topPage()}function home(){idx=-1;render();topPage()}function err(t){$('error').textContent=t}function c(){return cases[idx]}function part(i){return s.parts[i]||(s.parts[i]={clue:-1,intro:'',ev:'',link:'',why:''})}function sentences(){return c().passage.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(Boolean)}function punct(t){t=t.trim();return t&&!/[.!?]$/.test(t)?t+'.':t}function phrases(i){return c().type==='evidence'? (i?['Also,','Another example is that','The story also tells us that']:['According to the text,','For example,','The story tells us that']):c().type==='sequence'? [['First,','To begin,'],['Next,','Then,'],['Then,','After that,'],['Finally,','In the end,']][i]:[['At first,','In the beginning,'],['Then,','Later,'],['By the end,','Finally,']][i]}const links=['This shows that','This means that','This helps me understand that'];function pieces(){return (s.answer?`<div class="piece">${esc(punct(s.answer))}</div>`:'')+c().missions.map((_,i)=>{let p=part(i);return (p.intro&&p.ev.trim()?`<div class="piece evidence">${esc(punct(p.intro+' '+p.ev))}</div>`:'')+(p.link&&p.why.trim()?`<div class="piece reason">${esc(punct(p.link+' '+p.why))}</div>`:'')}).join('')||'<p class="small">Your writing will grow here.</p>'}function update(k,v,i){if(i===undefined)s[k]=v;else part(i)[k]=v;save();if($('preview'))$('preview').innerHTML=pieces()}function choose(i,j){let p=part(i);if(p.clue!==j){p.clue=j;p.ev='';p.why=''}save();render()}function pick(i,k,j){part(i)[k]=(k==='intro'?phrases(i):links)[j];save();render()}function opts(i,k){return (k==='intro'?phrases(i):links).map((t,j)=>`<button class="${part(i)[k]===t?'selected':''}" aria-pressed="${part(i)[k]===t}" onclick="pick(${i},'${k}',${j})">${esc(t)}</button>`).join('')}function reader(i){return `<h3>Read and click a clue</h3><p class="small">Click a part of the story that helps your mission.</p>`+sentences().map((t,j)=>`<button class="clue ${part(i).clue===j?'selected':''}" aria-pressed="${part(i).clue===j}" onclick="choose(${i},${j})">${esc(t)}</button>`).join('')+`<p class="small">${esc(c().author||'')} · ${esc(c().credit||'ReadWorks')}</p>`}function preview(){return '<h3>Your growing paragraph</h3><div id="preview">'+pieces()+'</div>'}function explain(i){let p=part(i);return `<h3>Your saved clue</h3><div class="evidence">${esc(sentences()[p.clue]||'')}</div><label>${c().type==='evidence'?'1. Introduce your evidence.':'Choose words that show when this happened.'}</label>${i===0?'<p class="small">Linking words help your reader follow your ideas.</p>':''}${opts(i,'intro')}<label for="ev">Write what your clue says in your own words.</label><textarea id="ev" oninput="update('ev',this.value,${i})">${esc(p.ev)}</textarea>`+(c().type==='evidence'?`<label>2. Explain why your clue matters.</label>${i===0?'<p class="small">These words introduce your thinking, not another clue.</p>':''}${opts(i,'link')}<textarea aria-label="Explain your thinking" placeholder="How does this clue help answer the question?" oninput="update('why',this.value,${i})">${esc(p.why)}</textarea>`:'')}
function endStep(){return 3+2*c().missions.length}function next(){let n=s.step,e=endStep();if(n===2&&!s.answer.trim())return err('Write your answer first.');if(n>=3&&n<e){let i=Math.floor((n-3)/2),p=part(i);if(n%2===1&&p.clue<0)return err('Click a clue first.');if(n%2===0&&(!p.intro||!p.ev.trim()||(c().type==='evidence'&&(!p.link||!p.why.trim()))))return err('Choose your linking words and finish your writing.')}if(n===e+1){if(!s.final.trim())return err('Write your paragraph first.');if(!$('check1').checked||!$('check2').checked)return err('Check both items before finishing.');s.done=true;save();render();topPage();return}go(n+1)}function insert(j){let t=finalPhrases()[j],a=$('final'),i=a.selectionStart,k=a.selectionEnd,pre=a.value.slice(0,i),add=(pre&&!/\s$/.test(pre)?' ':'')+t+' ';a.value=pre+add+a.value.slice(k);update('final',a.value);a.focus();a.setSelectionRange(i+add.length,i+add.length)}function finalPhrases(){return [...new Set(c().missions.flatMap((_,i)=>phrases(i)).concat(c().type==='evidence'?links:[]))]}function exportText(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c().title+'\n'+s.final],{type:'text/plain'}));a.download=c().title.replace(/[^a-z0-9]+/gi,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){if(idx<0){$('app').innerHTML=`<div class="home-hero"><span class="hero-icon" aria-hidden="true">🔎</span><div><h1 id="heading" tabindex="-1">Welcome, Detective!</h1><p>Pick a case. Find clues. Crack the writing mystery!</p></div></div><h2>📁 Your case files</h2><button onclick="test=!test;render()">Teacher Testing Mode: ${test?'ON':'OFF'}</button><div class="layout case-grid">${cases.map((x,i)=>{let d=db[(test?'test:':'student:')+i],locked=!test&&i>0&&!db['student:'+(i-1)]?.done;return `<section class="panel case-card ${locked?'locked':''}" style="--accent:${['#7950bc','#2479b9','#29936b','#d39a31'][i%4]}"><span class="case-number">CASE ${String(i+1).padStart(2,'0')}</span><span class="case-icon" aria-hidden="true">${locked?'🔒':d?.done?'🏆':['⭐','🐜','🐸','🍎','🌱','📚','✈️','🏜️','📖','🍽️','🎃','🚲','💬','🏺','🥣'][i]}</span><h3>${esc(x.title)}</h3><p class="small">${x.type==='evidence'?'Evidence and explanation':x.type==='sequence'?'Sequence':'Change over time'}</p><button class="${locked?'':'primary'}" ${locked?'disabled':''} onclick="openCase(${i})">${locked?'Locked':d?.done?'Review case':d?'Continue case':'Open case'}</button></section>`}).join('')}</div>`;return}let n=s.step,e=endStep(),L='',R='',title='',btn='';if(n===0){title='Watch me write';btn='Start my mission';const models={evidence:{story:'Mia forgot her umbrella. When it rained, her clothes got wet.',q:'Why should Mia check the weather?',answer:'Mia should check the weather so she can be ready for rain.',rows:[['For example,','Mia forgot her umbrella and got wet.','Introduce a clue from the story.'],['This shows that','being ready can help Mia stay dry.','Explain why the clue matters.']]},sequence:{story:'Ben planted a seed in soil. He watered it. A root grew. A little green shoot came up.',q:'How did Ben grow a plant?',answer:'Ben grew a plant by following several steps.',rows:[['First,','Ben planted a seed.','Tell what happened first.'],['Next,','he watered it.','Tell what happened next.'],['Then,','a root grew.','Keep the events in order.'],['Finally,','a green shoot came up.','Tell what happened last.']]},change:{story:'Lena was nervous about reading aloud. She practiced with a friend. By Friday, she felt brave enough to read to the class.',q:'How did Lena change?',answer:'Lena became more confident about reading aloud.',rows:[['At first,','Lena felt nervous.','Describe the beginning.'],['Later,','she practiced with a friend.','Show what helped her change.'],['By the end,','she felt brave enough to read to the class.','Describe the change.']]}};const m=models[c().type]||models.evidence;L=`<h3>Read this little story</h3><p>${esc(m.story)}</p><div class="question">${esc(m.q)}</div><p><b>Answer:</b> ${esc(m.answer)}</p>`;R='<h3>Watch how I connect my ideas</h3>'+m.rows.map((r,i)=>`<div class="${c().type==='evidence'&&i===1?'reason':'evidence'}"><span class="phrase">${esc(r[0])}</span> ${esc(r[1])}</div><p class="small">${esc(r[2])}</p>`).join('')+'<h3>Try it with me</h3><p>Which words would you use to '+(c().type==='evidence'?'introduce a clue?':c().type==='sequence'?'tell what happens first?':'describe the beginning?')+'</p>'+[m.rows[0][0],m.rows[m.rows.length-1][0]].map((v,i)=>`<button onclick="document.getElementById('practiceFeedback').textContent=${i===0?"'Yes! Those words help your reader.'":"'Try again. Look at the first example above.'"}">${esc(v)}</button>`).join('')+'<p id="practiceFeedback" role="status"></p><p class="small">You can start your mission whenever you are ready.</p>'}if(n===1){title='Understand your mission';btn='Write my answer';L='<h3>Read the story</h3>'+c().passage.split(/\n+/).map(t=>`<p>${esc(t)}</p>`).join('');R='<h3>What are you looking for?</h3><p>'+ (c().type==='evidence'?'Look for details that help prove your answer.':'Look for what happens in order, from beginning to end.')+'</p>'}if(n===2){title='Start your answer';btn='Find my first clue';L=`<label for="answer">Write one complete sentence that answers the question.</label><p class="small">${esc(c().starter||'Use words from the question to start.')}</p><textarea id="answer" oninput="update('answer',this.value)">${esc(s.answer)}</textarea>`;R=preview()}if(n>=3&&n<e){let i=Math.floor((n-3)/2);if(n%2===1){title='Find clue '+(i+1);btn='Use this clue';L=reader(i);R=`<h3>🔎 Clue mission ${i+1} of ${c().missions.length}</h3><p>${esc(c().missions[i])}</p><div class="evidence">${esc(sentences()[part(i).clue]||'Your clue will appear here.')}</div>`+preview()}else{title=c().type==='evidence'?'Use and explain clue '+(i+1):'Write event '+(i+1);btn=i+1===c().missions.length?'Review my writing':'Find my next clue';L=explain(i);R=preview()}}if(n===e){title='Put it all together';btn='Write my paragraph';L=pieces();R='<h3>Your writing is in order!</h3><p>Use these pieces to write your own paragraph on the next screen. You can change the words to make it sound better.</p>'}if(n===e+1){title='Make it even better';btn='Finish my case';L='<h3>My writing pieces</h3>'+pieces();R=`<h3>My final paragraph</h3><p class="small">Type your paragraph. Click a linking phrase to add it where you are typing.</p>${finalPhrases().map((t,j)=>`<button onmousedown="event.preventDefault()" onclick="insert(${j})">${esc(t)}</button>`).join('')}<textarea id="final" style="min-height:260px" oninput="update('final',this.value)">${esc(s.final)}</textarea><label><input id="check1" type="checkbox"> I used my clues ${c().type==='evidence'?'and explained them':'in order'}.</label><label><input id="check2" type="checkbox"> I reread my paragraph.</label>`}if(s.done){title='Case complete ⭐';L='<h3>My paragraph</h3><p>'+esc(s.final)+'</p>';R='<button onclick="exportText()">Save my paragraph</button><button onclick="s.done=false;go(endStep()+1)">Keep editing</button><p>Show your teacher. Your work has not been sent online.</p>'}$('app').innerHTML=`<button onclick="home()">← Cases</button><div class="mission-label">📁 ${esc(c().title)} · ${n===0?'Practice round':`Step ${n} of ${e+1}`}</div><div class="progress">${Array.from({length:e+1},(_,i)=>`<span class="${i<n?'done':i===n?'current':''}"></span>`).join('')}</div><h1 id="heading" tabindex="-1">${title}</h1>${s.done?'<div class="complete-banner"><span aria-hidden="true">🏆</span>Case closed! Great detective work!</div>':''}${n?`<div class="question"><b>Mission:</b> ${esc(c().question)}</div>`:''}<div class="layout"><section class="panel ${n===e+1?'sticky':''}">${L}</section><section class="panel ${n>=3&&n<e?'sticky':''}">${R}</section></div><div id="error" class="error" role="alert"></div><footer>${s.done?'<button class="primary" onclick="home()">Choose another case</button>':`<button onclick="go(${Math.max(0,n-1)})" ${n===0?'disabled':''}>← Back</button><button class="primary" onclick="next()">${btn} →</button>`}</footer><p id="status" class="small">Work saves on this browser. <button onclick="if(confirm('Clear this case’s writing?')){s=fresh();go(0)}">Start over</button></p>`}render();
